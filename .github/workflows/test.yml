name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the model-drift step resolves each sync commit in history
      - run: git config --global user.name "dev-kit CI"
      - run: git config --global user.email "ci@example.com"
      - run: tests/run-all.sh
      # drift is a prompt to run the maintain skill, not a build break
      - name: model drift (informational)
        run: for r in models/*/coverage.env; do bin/model-drift $r; done
        continue-on-error: true
